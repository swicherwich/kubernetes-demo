apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
  - namespace.yaml
  - ../../base
patches:
  - target:
      kind: Deployment
      name: hello-ml
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: "-text=Hello from Kustomize STAGING"
