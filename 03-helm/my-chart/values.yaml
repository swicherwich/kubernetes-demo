replicaCount: 2

image:
  repository: hashicorp/http-echo
  tag: "1.0"            # pinned on purpose, avoid "latest"
  pullPolicy: IfNotPresent

# text returned by the demo app (shows how values change the rendered YAML)
message: "Hello from Helm chart v1"

service:
  type: ClusterIP
  port: 80              # port of the Service
  targetPort: 5678      # port of the container (http-echo listens on 5678)

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

# Bonus (slide 37 question): needs `minikube addons enable metrics-server`
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
